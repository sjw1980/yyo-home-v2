<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Concept 1 — Aurora Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; }
  body { font-family: 'Inter', 'Malgun Gothic', sans-serif; background: #040807; color: #e7f2ef; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(95px); }
  .b1 { width: 560px; height: 560px; left: -140px; top: -180px; background: #0f5a4d; opacity: .5; }
  .b2 { width: 480px; height: 480px; right: -100px; top: 100px; background: #10405a; opacity: .45; }
  .b3 { width: 460px; height: 460px; left: 430px; bottom: -260px; background: #4a3a12; opacity: .35; }
  .frame { position: relative; height: 900px; padding: 42px 54px 38px; display: flex; flex-direction: column; }
  header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
  .eyebrow { font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: .3em; color: #7dbaaf; text-transform: uppercase; }
  h1 { margin: 12px 0 0; font-size: 33px; font-weight: 600; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #7dbaaf; }
  .sub { margin-top: 9px; font-size: 13px; color: #8ba19d; max-width: 560px; line-height: 1.65; }
  .chips { display: flex; gap: 8px; margin-top: 6px; }
  .chip { padding: 8px 15px; border-radius: 999px; font: 500 11px/1 'JetBrains Mono', monospace;
    color: #9db8b3; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(8px); }
  .chip.on { background: rgba(125,186,175,.16); border-color: rgba(125,186,175,.55); color: #bdeade; }
  .card { flex: 1; border-radius: 30px; padding: 22px 28px 20px;
    background: linear-gradient(158deg, rgba(255,255,255,.075), rgba(255,255,255,.018));
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 44px 90px -34px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter: blur(20px); display: flex; flex-direction: column; }
  .cardhead { display: flex; justify-content: space-between; align-items: center;
    font: 500 10.5px/1 'JetBrains Mono', monospace; letter-spacing: .18em; color: #6f8783; text-transform: uppercase; }
  .live { display: flex; align-items: center; gap: 7px; color: #7dbaaf; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #7dbaaf; box-shadow: 0 0 12px 3px rgba(125,186,175,.7); }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; }
  svg { width: 100%; height: 100%; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 6px; }
  .tile { padding: 13px 15px; border-radius: 16px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.075); }
  .tile.act { background: rgba(125,186,175,.13); border-color: rgba(125,186,175,.42); }
  .tk { font: 500 9.5px/1 'JetBrains Mono', monospace; letter-spacing: .16em; color: #7d938f; text-transform: uppercase; }
  .tv { margin-top: 8px; font: 700 21px/1 'Inter', sans-serif; letter-spacing: -.01em; color: #dcece9; }
  .tile.act .tv { color: #9ee0d1; }
  .tu { font-size: 11px; font-weight: 400; color: #7d938f; margin-left: 3px; }
  .bar { margin-top: 9px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.09); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #3f7d72, #7dbaaf); }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="frame">
    <header>
      <div>
        <div class="eyebrow">Concept 01 · Aurora Glass</div>
        <h1>전동 시트 형상 <em>실시간 뷰어</em></h1>
        <p class="sub">현재 브랜드 팔레트(딥 그린 + 민트)를 유지하면서, 유리 질감 패널과 입체 쿠션 렌더링으로 다듬은 가장 안전한 진화안입니다.</p>
      </div>
      <div class="chips">
        <div class="chip on">M4 · TILT</div><div class="chip">M1 SLIDE</div><div class="chip">M5 RECLINE</div><div class="chip">RELAX OFF</div>
      </div>
    </header>
    <div class="card">
      <div class="cardhead">
        <span>Side Profile · 1:2 · DPSS-10AXIS</span>
        <span class="live"><i class="dot"></i>LIVE SIMULATION</span>
      </div>
      <div class="stage">
        <svg viewBox="0 0 900 520">
          <defs>
            <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#41574f" /><stop offset="50%" stop-color="#243430" /><stop offset="100%" stop-color="#111b19" />
            </linearGradient>
            <linearGradient id="padB" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4a625b" /><stop offset="55%" stop-color="#25352f" /><stop offset="100%" stop-color="#101a18" />
            </linearGradient>
            <linearGradient id="padAct" x1="0" y1="0" x2="0.35" y2="1">
              <stop offset="0%" stop-color="#79c2b3" /><stop offset="55%" stop-color="#2d5951" /><stop offset="100%" stop-color="#142624" />
            </linearGradient>
            <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5b706a" /><stop offset="100%" stop-color="#1a2422" />
            </linearGradient>
            <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(255,255,255,.55)" /><stop offset="80%" stop-color="rgba(255,255,255,.03)" />
            </linearGradient>
            <radialGradient id="floor" cx="50%" cy="50%">
              <stop offset="0%" stop-color="rgba(125,186,175,.22)" /><stop offset="100%" stop-color="rgba(125,186,175,0)" />
            </radialGradient>
            <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity=".62" />
            </filter>
            <filter id="mint" x="-70%" y="-70%" width="240%" height="240%">
              <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#7dbaaf" flood-opacity=".65" />
            </filter>
          </defs>

          <ellipse cx="470" cy="462" rx="330" ry="30" fill="url(#floor)" />

          <!-- ===== 레일 / 슬라이드 ===== -->
          <line x1="120" y1="452" x2="800" y2="452" stroke="#22302d" stroke-width="2" />
          <line x1="240" y1="440" x2="700" y2="440" stroke="#2c3d39" stroke-width="9" stroke-linecap="round" />
          <g stroke="#3a4d48" stroke-width="1.6">
            <line x1="240" y1="430" x2="240" y2="450" /><line x1="300" y1="432" x2="300" y2="448" />
            <line x1="360" y1="432" x2="360" y2="448" /><line x1="420" y1="432" x2="420" y2="448" />
            <line x1="480" y1="430" x2="480" y2="450" /><line x1="540" y1="432" x2="540" y2="448" />
            <line x1="600" y1="432" x2="600" y2="448" /><line x1="660" y1="432" x2="660" y2="448" />
            <line x1="700" y1="430" x2="700" y2="450" />
          </g>
          <rect x="452" y="428" width="10" height="26" rx="5" fill="#7dbaaf" filter="url(#mint)" />
          <text x="240" y="478" font-family="JetBrains Mono, monospace" font-size="11" fill="#5f736e" letter-spacing="2">FWD</text>
          <text x="676" y="478" font-family="JetBrains Mono, monospace" font-size="11" fill="#5f736e" letter-spacing="2">AFT</text>

          <!-- ===== 하이트 리프트 (팬티그래프) ===== -->
          <g stroke="url(#metal)" stroke-width="9" stroke-linecap="round" filter="url(#soft)">
            <line x1="404" y1="430" x2="556" y2="378" />
            <line x1="556" y1="430" x2="404" y2="378" />
          </g>
          <rect x="392" y="424" width="176" height="20" rx="9" fill="url(#metal)" stroke="#0b1211" stroke-width="1.4" filter="url(#soft)" />

          <!-- ===== 레그레스트 ===== -->
          <g transform="rotate(16, 300, 378)" filter="url(#soft)">
            <rect x="168" y="358" width="140" height="36" rx="17" fill="url(#pad)" stroke="#4b6b64" stroke-width="1.6" />
            <rect x="158" y="348" width="30" height="56" rx="14" fill="url(#padB)" stroke="#4b6b64" stroke-width="1.6" />
            <path d="M200 366 H300" stroke="rgba(255,255,255,.10)" stroke-width="1.6" stroke-dasharray="5 6" />
          </g>
          <circle cx="300" cy="378" r="6.5" fill="#7dbaaf" stroke="#0b1211" stroke-width="1.6" filter="url(#mint)" />

          <!-- ===== 쿠션 (틸트) ===== -->
          <g transform="rotate(-4, 566, 306)" filter="url(#soft)">
            <path d="M566 300 L372 306 C320 309 288 318 278 340 C268 362 288 374 320 374 L548 376
                     C574 376 582 364 582 344 L582 316 C582 304 578 300 566 300 Z"
                  fill="url(#pad)" stroke="#517a70" stroke-width="1.8" />
            <path d="M372 306 C320 309 288 318 278 340" fill="none" stroke="url(#rim)" stroke-width="2.6" />
            <path d="M360 312 L360 372" stroke="rgba(0,0,0,.45)" stroke-width="1.6" />
            <path d="M364 316 L300 322" stroke="rgba(255,255,255,.08)" stroke-width="1.4" stroke-dasharray="4 7" />
            <path d="M420 316 L420 372 M480 314 L480 372" stroke="rgba(0,0,0,.30)" stroke-width="1.4" />
          </g>

          <!-- ===== 등받이 (리클라이너 · 활성) ===== -->
          <g transform="rotate(9, 566, 306)" filter="url(#soft)">
            <path d="M552 306 L592 128 C596 96 616 84 642 84 C670 84 688 100 684 130 L646 306 Z"
                  fill="url(#padAct)" stroke="#7fcbc0" stroke-width="2" filter="url(#mint)" />
            <path d="M592 128 C596 96 616 84 642 84" fill="none" stroke="url(#rim)" stroke-width="3" />
            <path d="M604 150 L636 152 M600 190 L632 192 M596 230 L628 232" stroke="rgba(0,0,0,.32)" stroke-width="1.6" />
            <path d="M612 120 C616 104 628 96 642 96" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.6" />
            <!-- 사이드 볼스터 -->
            <path d="M546 300 L586 134 C589 108 604 96 622 94 L626 118 C612 122 602 134 600 150 L568 300 Z"
                  fill="url(#padB)" stroke="#5c8b81" stroke-width="1.6" />
            <!-- 럼버 -->
            <ellipse cx="566" cy="232" rx="15" ry="40" fill="url(#padB)" stroke="#7fcbc0" stroke-width="1.8" />
            <ellipse cx="562" cy="232" rx="6" ry="24" fill="rgba(125,186,175,.22)" />
            <!-- 헤드레스트 -->
            <rect x="616" y="86" width="10" height="24" rx="4" fill="#2b3b37" />
            <rect x="654" y="86" width="10" height="24" rx="4" fill="#2b3b37" />
            <rect x="596" y="22" width="92" height="68" rx="28" fill="url(#padB)" stroke="#5c8b81" stroke-width="1.8" />
            <path d="M608 44 C620 32 654 30 672 40" fill="none" stroke="url(#rim)" stroke-width="2.4" />
          </g>

          <!-- ===== 틸트 / 리클라이너 모션 아크 ===== -->
          <path d="M600 306 A 60 60 0 0 0 592 250" fill="none" stroke="#e0b96a" stroke-width="1.6" stroke-dasharray="5 5" opacity=".85" />
          <path d="M288 330 A 96 96 0 0 1 330 300" fill="none" stroke="#e0b96a" stroke-width="1.6" stroke-dasharray="5 5" opacity=".7" />

          <!-- ===== 수치 칩 ===== -->
          <g font-family="JetBrains Mono, monospace" font-size="12">
            <g>
              <line x1="700" y1="150" x2="640" y2="176" stroke="rgba(125,186,175,.5)" stroke-width="1.2" />
              <circle cx="640" cy="176" r="3.4" fill="#7dbaaf" />
              <rect x="700" y="132" width="152" height="34" rx="10" fill="rgba(6,12,11,.78)" stroke="rgba(125,186,175,.55)" />
              <text x="714" y="146" font-size="9" fill="#7d938f" letter-spacing="1.6">RECLINE</text>
              <text x="714" y="160" fill="#bdeade" font-weight="700">32.5°</text>
              <text x="782" y="160" font-size="9.5" fill="#e0b96a">TGT 40.0°</text>
            </g>
            <g>
              <line x1="700" y1="248" x2="586" y2="238" stroke="rgba(125,186,175,.35)" stroke-width="1.2" />
              <circle cx="586" cy="238" r="3" fill="#8fb8b2" />
              <rect x="700" y="232" width="152" height="34" rx="10" fill="rgba(6,12,11,.7)" stroke="rgba(255,255,255,.12)" />
              <text x="714" y="246" font-size="9" fill="#7d938f" letter-spacing="1.6">LUMBAR</text>
              <text x="714" y="260" fill="#cfe0dd" font-weight="700">+18 mm</text>
            </g>
            <g>
              <line x1="238" y1="266" x2="300" y2="304" stroke="rgba(224,185,106,.5)" stroke-width="1.2" />
              <circle cx="300" cy="304" r="3" fill="#e0b96a" />
              <rect x="96" y="248" width="146" height="34" rx="10" fill="rgba(6,12,11,.7)" stroke="rgba(255,255,255,.12)" />
              <text x="110" y="262" font-size="9" fill="#7d938f" letter-spacing="1.6">TILT</text>
              <text x="110" y="276" fill="#cfe0dd" font-weight="700">7.5°</text>
            </g>
            <g>
              <rect x="96" y="306" width="146" height="34" rx="10" fill="rgba(6,12,11,.7)" stroke="rgba(255,255,255,.12)" />
              <text x="110" y="320" font-size="9" fill="#7d938f" letter-spacing="1.6">CUSHION EXT</text>
              <text x="110" y="334" fill="#cfe0dd" font-weight="700">42 mm</text>
            </g>
            <g>
              <rect x="96" y="392" width="146" height="34" rx="10" fill="rgba(6,12,11,.7)" stroke="rgba(255,255,255,.12)" />
              <text x="110" y="406" font-size="9" fill="#7d938f" letter-spacing="1.6">LEGREST</text>
              <text x="110" y="420" fill="#cfe0dd" font-weight="700">22.0°</text>
            </g>
          </g>
        </svg>
      </div>

      <div class="tiles">
        <div class="tile"><div class="tk">Slide</div><div class="tv">150<span class="tu">mm</span></div><div class="bar"><i style="width:50%"></i></div></div>
        <div class="tile"><div class="tk">Height</div><div class="tv">50<span class="tu">mm</span></div><div class="bar"><i style="width:50%"></i></div></div>
        <div class="tile act"><div class="tk">Tilt</div><div class="tv">7.5<span class="tu">deg</span></div><div class="bar"><i style="width:50%"></i></div></div>
        <div class="tile"><div class="tk">Legrest</div><div class="tv">22.0<span class="tu">deg</span></div><div class="bar"><i style="width:49%"></i></div></div>
        <div class="tile"><div class="tk">Recline</div><div class="tv">32.5<span class="tu">deg</span></div><div class="bar"><i style="width:54%"></i></div></div>
      </div>
    </div>
  </div>
</body>
</html>
