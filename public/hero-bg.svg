<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2321"/>
      <stop offset="0.55" stop-color="#141a19"/>
      <stop offset="1" stop-color="#0d1111"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.68" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7dbaaf" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#56807d" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0d1111" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.2" cy="0.75" r="0.45">
      <stop offset="0" stop-color="#3b5a55" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0d1111" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#252f2b"/>
      <stop offset="0.5" stop-color="#2f3c37"/>
      <stop offset="1" stop-color="#1d2522"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#394943"/>
      <stop offset="1" stop-color="#232e2a"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dbaaf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dbaaf" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7dbaaf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a221f"/>
      <stop offset="1" stop-color="#0d1111"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#56807d" opacity="0.28"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <!-- clip to cut wheel arches out of the body -->
    <mask id="archCut">
      <rect width="1920" height="1080" fill="#fff"/>
      <circle cx="1005" cy="726" r="96" fill="#000"/>
      <circle cx="1560" cy="726" r="96" fill="#000"/>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>
  <rect width="1920" height="1080" fill="url(#dots)" opacity="0.5"/>

  <!-- studio floor: ground line at y=808; wheels rest exactly on it -->
  <rect x="0" y="808" width="1920" height="272" fill="url(#floor)"/>
  <line x1="0" y1="808" x2="1920" y2="808" stroke="#31403b" stroke-width="2" opacity="0.6"/>

  <!-- abstract EV fastback (no brand features). Ground contact: wheel cy 726 + r 82 = 808 -->
  <g>
    <ellipse cx="1285" cy="812" rx="430" ry="26" fill="#000" opacity="0.5" filter="url(#soft)"/>

    <g mask="url(#archCut)">
      <path d="M790 760
               C 815 690 900 645 1010 630
               C 1105 540 1220 505 1345 505
               C 1470 505 1560 555 1620 630
               C 1700 648 1745 690 1750 745
               C 1752 760 1740 768 1715 768
               L 820 768
               C 796 768 786 766 790 760 Z"
            fill="url(#body)"/>
      <!-- rocker sill connecting arch bottoms -->
      <path d="M1099 762 L 1467 762 L 1467 772 L 1099 772 Z" fill="url(#body)"/>
    </g>

    <!-- wheel arch rims -->
    <path d="M909 726 A 96 96 0 0 1 1101 726" fill="none" stroke="#3a4a44" stroke-width="5"/>
    <path d="M1464 726 A 96 96 0 0 1 1656 726" fill="none" stroke="#3a4a44" stroke-width="5"/>

    <!-- glass canopy -->
    <path d="M1045 622
             C 1128 552 1235 522 1342 522
             C 1440 522 1520 556 1572 616
             C 1440 600 1160 604 1045 622 Z"
          fill="url(#glass)" opacity="0.9"/>
    <!-- roof highlight: exactly on body upper contour -->
    <path d="M1012 628 C 1105 541 1220 507 1345 507 C 1468 507 1558 556 1618 628"
          fill="none" stroke="#8fbf9f" stroke-width="3" opacity="0.5"/>
    <!-- side character line -->
    <path d="M840 700 C 1100 672 1500 672 1730 706"
          fill="none" stroke="#41564e" stroke-width="3" opacity="0.8"/>
    <!-- lights flush with body ends -->
    <path d="M795 728 L 985 720" stroke="url(#dash)" stroke-width="7" stroke-linecap="round" filter="url(#soft2)"/>
    <path d="M1625 722 L 1745 734" stroke="#c0655a" stroke-width="6" stroke-linecap="round" opacity="0.7" filter="url(#soft2)"/>

    <!-- wheels: aero discs resting on floor -->
    <g>
      <circle cx="1005" cy="726" r="82" fill="#0e1312"/>
      <circle cx="1005" cy="726" r="78" fill="none" stroke="#3a4a44" stroke-width="6"/>
      <circle cx="1005" cy="726" r="40" fill="none" stroke="#7dbaaf" stroke-width="2.5" opacity="0.5"/>
      <circle cx="1560" cy="726" r="82" fill="#0e1312"/>
      <circle cx="1560" cy="726" r="78" fill="none" stroke="#3a4a44" stroke-width="6"/>
      <circle cx="1560" cy="726" r="40" fill="none" stroke="#7dbaaf" stroke-width="2.5" opacity="0.5"/>
    </g>

    <!-- contact shadows under wheels -->
    <ellipse cx="1005" cy="808" rx="86" ry="9" fill="#000" opacity="0.55" filter="url(#soft2)"/>
    <ellipse cx="1560" cy="808" rx="86" ry="9" fill="#000" opacity="0.55" filter="url(#soft2)"/>
    <!-- underglow -->
    <path d="M1100 780 L 1470 780" stroke="#7dbaaf" stroke-width="4" opacity="0.3" filter="url(#soft)"/>
  </g>

  <!-- telemetry arcs emanating from the car nose (left), connecting to the vehicle -->
  <g fill="none" stroke-linecap="round">
    <path d="M795 726 C 640 700 520 620 445 520" stroke="#7dbaaf" stroke-width="3" opacity="0.45"/>
    <path d="M795 726 C 620 715 470 660 375 565" stroke="#56807d" stroke-width="2" opacity="0.3"/>
    <path d="M795 726 C 600 730 420 700 315 615" stroke="#3d5a54" stroke-width="1.6" opacity="0.22"/>
    <circle cx="445" cy="520" r="5" fill="#7dbaaf" stroke="none" opacity="0.8"/>
    <circle cx="375" cy="565" r="3.5" fill="#7dbaaf" stroke="none" opacity="0.5"/>
  </g>

  <!-- speed streaks aligned toward the nose -->
  <g stroke="#7dbaaf" stroke-linecap="round">
    <line x1="140" y1="655" x2="560" y2="655" stroke-width="2" opacity="0.28"/>
    <line x1="230" y1="700" x2="540" y2="700" stroke-width="1.6" opacity="0.18"/>
    <line x1="110" y1="745" x2="480" y2="745" stroke-width="1.4" opacity="0.12"/>
  </g>
</svg>
